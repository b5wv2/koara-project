<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: 'Inter', Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f8fafc; }
    .container { max-width: 600px; margin: 40px auto; padding: 30px; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    h1 { color: #1e293b; margin-top: 0; font-size: 24px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
    p { margin-bottom: 16px; font-size: 16px; }
    .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e2e8f0; font-size: 12px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>{{subject}}</h1>
    <p>Hello,</p>
    <div style="white-space: pre-wrap; padding: 15px; background: #f1f5f9; border-radius: 6px; border-left: 4px solid #3b82f6;">
      {{message}}
    </div>
    <p style="margin-top: 20px;">Thank you,<br>The Super Admin Team</p>
    <div class="footer">
      This is an automated broadcast message from Koara.
    </div>
  </div>
</body>
</html>
